# LLM price table (USD per 1k tokens) used to estimate AI costs in ai_runs.cost and the Costs report.
# Estimates only — caching, batch discounts, image tokens and FX are NOT reflected here.
#
# Matching: Ai::ModelRouter.price_for does a substring `model.include?(match)` and takes the FIRST
# hit, so ORDER MATTERS — list the most specific patterns first (e.g. gpt-4o-mini before gpt-4o,
# claude-3-5-sonnet before claude). `default` is the fallback when nothing matches.
#
# Override WITHOUT deploy: set an InstallationConfig named AI_LLM_PRICES to a JSON payload with the
# same shape ({ "default": [in, out], "prices": [{ "match": "...", "in": 0.0, "out": 0.0 }] }).
# Entries with a `match` already present here replace this one in place; new matches are checked
# first. See Ai::ModelRouter.price_table.
updated_at: "2026-07-04"
default: [0.001, 0.003]
